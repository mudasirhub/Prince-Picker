<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Prince Picker</title>
  <meta name="description" content="Get in touch with the lead developer and creator of Prince Picker, the offline-first warehouse picking and inventory management software.">
  <link rel="canonical" href="https://princepicker.mudasirkhan.in/contact.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Favicons -->
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <style>
    :root {
      --bg: #050505;
      --surf: #111111;
      --surf2: #1A1A1A;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #FFFFFF;
      --mut: #A3A3A3;
      --border: #232323;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    ::selection {
      background: var(--primary);
      color: #fff;
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5, 5, 5, 0.8);
      backdrop-filter: blur(12px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.5px;
      text-decoration: none;
      color: var(--text);
    }

    .brand svg {
      width: 28px;
      height: 28px;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    .nav-links a {
      color: var(--mut);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    /* Contact Section */
    .contact-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 20px;
    }

    .contact-card {
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .contact-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--primary);
    }

    .avatar {
      width: 96px;
      height: 96px;
      background: var(--surf2);
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--primary);
      color: var(--primary);
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 8px;
      color: var(--text);
    }

    h1 span {
      color: var(--primary);
    }

    .subtitle {
      color: var(--mut);
      font-size: 16px;
      margin-bottom: 32px;
      font-weight: 500;
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--surf2);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s;
    }

    .contact-link:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 106, 0, 0.1);
    }

    .contact-link svg {
      width: 24px;
      height: 24px;
      color: var(--primary);
    }

    @media (max-width: 900px) {
      .nav-links {
        display: none;
      }

      nav {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav aria-label="Main Navigation">
      <a href="/" class="brand" aria-label="Prince Picker home page">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2">
          <ellipse cx="12" cy="5" rx="9" ry="3" />
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
        </svg>
        Prince Picker
      </a>
      <div class="nav-links">
        <a href="/index.html#features">Features</a>
        <a href="/pricing.html">Pricing</a>
        <a href="/docs.html">Docs</a>
        <a href="/download/">Download App</a>
        <a href="https://github.com/mudasirhub/Prince-Picker" target="_blank" aria-label="Prince Picker GitHub repository (opens in a new tab)">GitHub</a>
      </div>
      <a href="/app/" class="btn-primary" aria-label="Launch Prince Picker PWA application">Launch App</a>
    </nav>
  </header>

  <main class="contact-wrapper" aria-label="Contact mudasirkhan">
    <div class="contact-card">
      <div class="avatar">
        <img src="https://github.com/mudasirhub.png" alt="Mudasir Khan" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Mudasir+Khan&background=2563eb&color=fff';">
      </div>
      <h1>Mudasir <span>Khan</span></h1>
      <div class="subtitle">Creator & Lead Developer</div>

      <div class="contact-links">
        <a href="mailto:mudasirkhandev@gmail.com" class="contact-link" aria-label="Send email to mudasirkhandev@gmail.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          mudasirkhandev@gmail.com
        </a>
        <a href="https://instagram.com/mud.asirkhan" target="_blank" class="contact-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          @mudasirkhan
        </a>
      </div>
    </div>
  </main>

</body>

</html>
