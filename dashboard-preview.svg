<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562" width="100%" height="100%" style="background:#F4F0EA; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <filter id="btn-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF6A00" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Top App Bar -->
  <rect x="0" y="0" width="1000" height="70" fill="#FFFFFF"/>
  <line x1="0" y1="70" x2="1000" y2="70" stroke="#EAE5DD" stroke-width="1"/>

  <text x="32" y="36" font-size="20" font-weight="800" fill="#111827">Picking Orders</text>
  <text x="32" y="52" font-size="11" font-weight="800" fill="#FF6A00" letter-spacing="0.5">DEMO PICKER</text>

  <!-- Header Right Icons -->
  <g transform="translate(910, 26)" stroke="#4B5563" stroke-width="2" fill="none">
    <!-- Bell Icon -->
    <path d="M6 14A6 6 0 0 0 18 14V9A6 6 0 0 0 6 9v5z"/>
    <path d="M4 14h16"/>
    <path d="M10 17a2 2 0 0 0 4 0"/>
  </g>

  <g transform="translate(950, 26)" stroke="#4B5563" stroke-width="2" fill="none">
    <!-- Sync Icon -->
    <path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"/>
    <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/>
  </g>

  <!-- Offline Badge -->
  <rect x="925" y="110" width="55" height="24" rx="12" fill="#FEF3C7"/>
  <text x="952" y="126" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">Offline</text>

  <text x="32" y="126" font-size="12" font-weight="700" fill="#6B7280" letter-spacing="0.8">0 ORDERS</text>

  <!-- Main Empty State Card -->
  <rect x="32" y="150" width="936" height="340" rx="20" fill="#FFFFFF" stroke="#E5E0D8" stroke-width="1.5" stroke-dasharray="6 6" filter="url(#shadow)"/>

  <!-- Clipboard Icon -->
  <g transform="translate(475, 190)">
    <rect x="6" y="8" width="38" height="46" rx="6" fill="#FDE68A" stroke="#1F2937" stroke-width="3"/>
    <path d="M16 4h18a3 3 0 0 1 3 3v3H13V7a3 3 0 0 1 3-3z" fill="#E5E7EB" stroke="#1F2937" stroke-width="3"/>
    <line x1="14" y1="22" x2="36" y2="22" stroke="#1F2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="30" x2="36" y2="30" stroke="#1F2937" stroke-width="3" stroke-linecap="round"/>
    <line x1="14" y1="38" x2="28" y2="38" stroke="#1F2937" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Text Heading & Subtitle -->
  <text x="500" y="275" font-size="22" font-weight="800" fill="#111827" text-anchor="middle">No Orders Available</text>

  <text x="500" y="305" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">Waiting for picking jobs from the POS. You</text>
  <text x="500" y="325" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">can also load demo data or create a manual</text>
  <text x="500" y="345" font-size="14" font-weight="500" fill="#6B7280" text-anchor="middle">product.</text>

  <!-- Primary Button: Demo Data -->
  <g transform="translate(55, 370)">
    <rect x="0" y="0" width="890" height="44" rx="22" fill="#FF6A00" filter="url(#btn-shadow)"/>
    <text x="445" y="27" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Demo Data</text>
  </g>

  <!-- Secondary Button: New Product -->
  <g transform="translate(55, 426)">
    <rect x="0" y="0" width="890" height="42" rx="21" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="445" y="26" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">+ New Product</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <rect x="0" y="502" width="1000" height="60" fill="#FFFFFF"/>
  <line x1="0" y1="502" x2="1000" y2="502" stroke="#EAE5DD" stroke-width="1"/>

  <!-- Nav Item: ORDERS -->
  <g transform="translate(100, 510)">
    <rect x="25" y="2" width="30" height="24" rx="6" fill="#FFF7ED"/>
    <path d="M32 8l4 4 8-8" stroke="#FF6A00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30" y="6" width="18" height="14" rx="2" stroke="#FF6A00" stroke-width="2" fill="none"/>
    <text x="40" y="42" font-size="10" font-weight="800" fill="#FF6A00" text-anchor="middle">ORDERS</text>
  </g>

  <!-- Nav Item: CART -->
  <g transform="translate(300, 512)">
    <path d="M30 10h4l4 14h16l3-10H36" stroke="#9CA3AF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="38" cy="28" r="2.5" fill="#9CA3AF"/>
    <circle cx="52" cy="28" r="2.5" fill="#9CA3AF"/>
    <text x="42" y="40" font-size="10" font-weight="700" fill="#9CA3AF" text-anchor="middle">CART</text>
  </g>

  <!-- Nav Item: SCAN (Center active) -->
  <g transform="translate(475, 494)">
    <circle cx="25" cy="22" r="24" fill="#FF6A00" filter="url(#btn-shadow)"/>
    <path d="M17 14h4v-4M29 10h4v4M33 26h-4v4M21 30h-4v-4" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <line x1="16" y1="20" x2="34" y2="20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="25" y="58" font-size="10" font-weight="800" fill="#FF6A00" text-anchor="middle">SCAN</text>
  </g>

  <!-- Nav Item: INVENTORY -->
  <g transform="translate(650, 512)">
    <rect x="30" y="8" width="20" height="4" rx="1" stroke="#9CA3AF" stroke-width="2" fill="none"/>
    <rect x="30" y="15" width="20" height="4" rx="1" stroke="#9CA3AF" stroke-width="2" fill="none"/>
    <rect x="30" y="22" width="20" height="4" rx="1" stroke="#9CA3AF" stroke-width="2" fill="none"/>
    <text x="40" y="40" font-size="10" font-weight="700" fill="#9CA3AF" text-anchor="middle">INVENTORY</text>
  </g>

  <!-- Nav Item: MORE -->
  <g transform="translate(830, 512)">
    <circle cx="32" cy="18" r="2" fill="#9CA3AF"/>
    <circle cx="40" cy="18" r="2" fill="#9CA3AF"/>
    <circle cx="48" cy="18" r="2" fill="#9CA3AF"/>
    <text x="40" y="40" font-size="10" font-weight="700" fill="#9CA3AF" text-anchor="middle">MORE</text>
  </g>
</svg>
