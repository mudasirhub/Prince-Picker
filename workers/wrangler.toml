name = "prince-picker-image-worker"
main = "image_upload_worker.js"
compatibility_date = "2024-01-01"

# Cloudflare R2 Bucket Binding
[[r2_buckets]]
binding = "PRINCE_BUCKET"
bucket_name = "prince"

# Public Production Worker URL for Image Delivery & Upload
[vars]
PUBLIC_IMAGE_URL = "https://prince-picker-image-worker.prince-picker.workers.dev"
PUBLIC_R2_URL = "https://prince-picker-image-worker.prince-picker.workers.dev"
